{
  "title": "Farm Max",
  "views": [
    {
      "card_mod": {
        "style": ":host { --grid-card-gap: 12px; --masonry-view-card-margin: 6px; }\n"
      },
      "cards": [
        {
          "cards": [
            {
              "icon": "mdi:sprout",
              "multiline_secondary": true,
              "primary": "Outside Smart switch",
              "secondary": "{% set bot = is_state('switch.smart_switch_deviceid_001_outlet_2', 'on') %} {% set pump = is_state('switch.smart_switch_deviceid_001_outlet_1', 'on') %} {% set rain = states('sensor.farmbot_pioneer_dr_weather_station_24h_rain_piezo') | float(0) %} {% if bot and pump %}FarmBot online · Irrigation running {% elif bot %}FarmBot online · Pump idle {% elif pump %}Pump running · FarmBot offline {% else %}Systems standing by · 24h rain {{ rain | round(1) }} mm{% endif %}",
              "tap_action": {
                "action": "none"
              },
              "type": "custom:mushroom-template-card",
              "color": "{% if is_state('switch.smart_switch_deviceid_001_outlet_2', 'on') %}green{% else %}grey{% endif %}",
              "features_position": "bottom",
              "card_mod": {
                "style": "ha-card {\n  overflow: hidden;\n  min-height: 112px; border-radius: 26px;\n  border: 1px solid rgba(255,255,255,0.12);\n  background: radial-gradient(circle at 90% 10%, rgba(76,175,80,0.22), transparent 34%), radial-gradient(circle at 10% 90%, rgba(0,188,212,0.15), transparent 38%), linear-gradient(135deg, rgba(20,27,38,0.98), rgba(8,12,20,0.98));\n  box-shadow: 0 14px 36px rgba(0,0,0,0.30); padding: 10px;\n}\nmushroom-state-info$ .primary { font-size: 28px !important; font-weight: 800 !important; letter-spacing: 0.12em; }\nmushroom-state-info$ .secondary { font-size: 15px !important; opacity: 0.82; }\nmushroom-shape-icon$ .shape { width: 64px !important; height: 64px !important; }\n"
              }
            }
          ],
          "layout": {
            "grid-gap": "12px",
            "grid-template-columns": "minmax(0, 1fr)",
            "margin": 0,
            "padding": 0
          },
          "layout_type": "custom:grid-layout",
          "type": "custom:layout-card",
          "view_layout": {
            "grid-column": "span 12"
          }
        },
        {
          "cards": [
            {
              "heading": "System Status",
              "heading_style": "title",
              "icon": "mdi:heart-pulse",
              "type": "heading"
            },
            {
              "cards": [
                {
                  "card_mod": {
                    "style": "ha-card {\n  overflow: hidden; min-height: 102px; border-radius: 22px; background: radial-gradient(circle at 10% 10%, rgba(0,210,130,0.18), transparent 48%), linear-gradient(135deg, rgba(11,41,31,0.97), rgba(14,20,27,0.97)); border: 1px solid rgba(0,220,135,0.28); }\n"
                  },
                  "entity": "switch.smart_switch_deviceid_001_outlet_2",
                  "hold_action": {
                    "action": "more-info"
                  },
                  "icon": "mdi:robot-industrial",
                  "icon_color": "{% if is_state(entity, 'on') %}green{% else %}grey{% endif %}",
                  "layout": "horizontal",
                  "primary": "FarmBot",
                  "secondary": "{% if is_state(entity, 'on') %}Online and powered{% else %}Offline{% endif %}",
                  "tap_action": {
                    "action": "toggle"
                  },
                  "type": "custom:mushroom-template-card"
                },
                {
                  "card_mod": {
                    "style": "ha-card {\n  overflow: hidden; min-height: 102px; border-radius: 22px; background: radial-gradient(circle at 10% 10%, rgba(30,150,255,0.18), transparent 48%), linear-gradient(135deg, rgba(12,32,49,0.97), rgba(14,20,27,0.97)); border: 1px solid rgba(25,155,255,0.28); }\n"
                  },
                  "entity": "switch.smart_switch_deviceid_001_outlet_1",
                  "hold_action": {
                    "action": "more-info"
                  },
                  "icon": "mdi:pump",
                  "icon_color": "{% if is_state(entity, 'on') %}blue{% else %}grey{% endif %}",
                  "layout": "horizontal",
                  "primary": "Pump",
                  "secondary": "{% if is_state(entity, 'on') %}Pressure active{% else %}Standing by{% endif %}",
                  "tap_action": {
                    "action": "toggle"
                  },
                  "type": "custom:mushroom-template-card"
                },
                {
                  "card_mod": {
                    "style": "ha-card {\n  overflow: hidden; min-height: 102px; border-radius: 22px; background: radial-gradient(circle at 10% 10%, rgba(30,150,255,0.18), transparent 48%), linear-gradient(135deg, rgba(12,32,49,0.97), rgba(14,20,27,0.97)); border: 1px solid rgba(25,155,255,0.28); }\n"
                  },
                  "entity": "switch.rain_bird_sprinkler_1",
                  "icon": "mdi:sprinkler",
                  "icon_color": "{% if is_state(entity, 'on') %}cyan{% else %}grey{% endif %}",
                  "layout": "horizontal",
                  "primary": "Front Garden",
                  "secondary": "{% if is_state(entity, 'on') %}Watering now{% else %}Idle{% endif %}",
                  "tap_action": {
                    "action": "toggle"
                  },
                  "type": "custom:mushroom-template-card"
                },
                {
                  "card_mod": {
                    "style": "ha-card {\n  overflow: hidden; min-height: 102px; border-radius: 22px; background: radial-gradient(circle at 10% 10%, rgba(30,150,255,0.18), transparent 48%), linear-gradient(135deg, rgba(12,32,49,0.97), rgba(14,20,27,0.97)); border: 1px solid rgba(25,155,255,0.28); }\n"
                  },
                  "entity": "switch.rain_bird_sprinkler_2",
                  "icon": "mdi:sprinkler-variant",
                  "icon_color": "{% if is_state(entity, 'on') %}light-blue{% else %}grey{% endif %}",
                  "layout": "horizontal",
                  "primary": "Back Fence",
                  "secondary": "{% if is_state(entity, 'on') %}Watering now{% else %}Idle{% endif %}",
                  "tap_action": {
                    "action": "toggle"
                  },
                  "type": "custom:mushroom-template-card"
                }
              ],
              "columns": 2,
              "square": false,
              "type": "grid"
            }
          ],
          "layout": {
            "grid-gap": "12px",
            "grid-template-columns": "minmax(0, 1fr)",
            "margin": 0,
            "padding": 0
          },
          "layout_type": "custom:grid-layout",
          "type": "custom:layout-card",
          "view_layout": {
            "grid-column": "span 4"
          }
        },
        {
          "cards": [
            {
              "heading": "Live Growing Conditions",
              "heading_style": "title",
              "icon": "mdi:leaf",
              "type": "heading",
              "view_layout": {
                "grid-column": "1 / -1"
              }
            },
            {
              "entity": "sensor.farmbot_pioneer_dr_weather_station_outdoor_temperature",
              "fill_container": true,
              "icon": "mdi:thermometer",
              "icon_color": "orange",
              "layout": "vertical",
              "primary": "Temperature",
              "secondary": "{{ states(entity) }} °C",
              "type": "custom:mushroom-template-card"
            },
            {
              "entity": "sensor.farmbot_pioneer_dr_weather_station_humidity",
              "fill_container": true,
              "icon": "mdi:water-percent",
              "icon_color": "blue",
              "layout": "vertical",
              "primary": "Humidity",
              "secondary": "{{ states(entity) }}%",
              "type": "custom:mushroom-template-card"
            },
            {
              "entity": "sensor.farmbot_pioneer_dr_weather_station_vapour_pressure_deficit",
              "fill_container": true,
              "icon": "mdi:leaf-circle",
              "icon_color": "green",
              "layout": "vertical",
              "primary": "VPD",
              "secondary": "{{ states(entity) | float(0) | round(2) }} hPa",
              "type": "custom:mushroom-template-card"
            },
            {
              "entity": "sensor.farmbot_pioneer_dr_weather_station_solar_radiation",
              "fill_container": true,
              "icon": "mdi:white-balance-sunny",
              "icon_color": "amber",
              "layout": "vertical",
              "primary": "Solar",
              "secondary": "{{ states(entity) | float(0) | round(0) }} W/m²",
              "type": "custom:mushroom-template-card"
            },
            {
              "entity": "sensor.farmbot_pioneer_dr_weather_station_daily_rain_piezo",
              "fill_container": true,
              "icon": "mdi:weather-rainy",
              "icon_color": "blue",
              "layout": "vertical",
              "primary": "Rain Today",
              "secondary": "{{ states(entity) | float(0) | round(1) }} mm",
              "type": "custom:mushroom-template-card"
            },
            {
              "entity": "sensor.farmbot_pioneer_dr_weather_station_24h_rain_piezo",
              "fill_container": true,
              "icon": "mdi:hours-24",
              "icon_color": "indigo",
              "layout": "vertical",
              "primary": "Rolling 24h",
              "secondary": "{{ states(entity) | float(0) | round(1) }} mm",
              "type": "custom:mushroom-template-card"
            },
            {
              "entity": "sensor.farmbot_pioneer_dr_weather_station_wind_speed",
              "fill_container": true,
              "icon": "mdi:weather-windy",
              "icon_color": "teal",
              "layout": "vertical",
              "primary": "Wind",
              "secondary": "{{ states(entity) | float(0) | round(1) }} km/h",
              "type": "custom:mushroom-template-card"
            },
            {
              "entity": "sensor.farmbot_pioneer_dr_weather_station_uv_index",
              "fill_container": true,
              "icon": "mdi:sun-wireless",
              "icon_color": "deep-orange",
              "layout": "vertical",
              "primary": "UV Index",
              "secondary": "{{ states(entity) | float(0) | round(0) }}",
              "type": "custom:mushroom-template-card"
            }
          ],
          "layout": {
            "grid-gap": "12px",
            "grid-template-columns": "repeat(4, minmax(0, 1fr))",
            "margin": 0,
            "mediaquery": {
              "(max-width: 900px)": {
                "grid-template-columns": "repeat(2, minmax(0, 1fr))"
              }
            },
            "padding": 0
          },
          "layout_type": "custom:grid-layout",
          "type": "custom:layout-card",
          "view_layout": {
            "grid-column": "span 8"
          }
        },
        {
          "cards": [
            {
              "heading": "Irrigation Control",
              "heading_style": "title",
              "icon": "mdi:sprinkler-variant",
              "type": "heading",
              "view_layout": {
                "grid-column": "1 / -1"
              }
            },
            {
              "entity": "switch.smart_switch_deviceid_001_outlet_1",
              "fill_container": true,
              "hold_action": {
                "action": "more-info"
              },
              "icon": "mdi:pump",
              "icon_color": "{% if is_state(entity, 'on') %}blue{% else %}grey{% endif %}",
              "layout": "vertical",
              "primary": "Pump",
              "secondary": "{% if is_state(entity, 'on') %}ON · supplying pressure{% else %}OFF{% endif %}",
              "tap_action": {
                "action": "toggle"
              },
              "type": "custom:mushroom-template-card"
            },
            {
              "entity": "switch.rain_bird_sprinkler_1",
              "fill_container": true,
              "hold_action": {
                "action": "more-info"
              },
              "icon": "mdi:sprinkler",
              "icon_color": "{% if is_state(entity, 'on') %}cyan{% else %}grey{% endif %}",
              "layout": "vertical",
              "primary": "Front LH Side",
              "secondary": "{% if is_state(entity, 'on') %}Watering{% else %}Idle{% endif %}",
              "tap_action": {
                "action": "toggle"
              },
              "type": "custom:mushroom-template-card"
            },
            {
              "entity": "switch.rain_bird_sprinkler_2",
              "fill_container": true,
              "hold_action": {
                "action": "more-info"
              },
              "icon": "mdi:sprinkler-variant",
              "icon_color": "{% if is_state(entity, 'on') %}light-blue{% else %}grey{% endif %}",
              "layout": "vertical",
              "primary": "Back Fence",
              "secondary": "{% if is_state(entity, 'on') %}Watering{% else %}Idle{% endif %}",
              "tap_action": {
                "action": "toggle"
              },
              "type": "custom:mushroom-template-card"
            },
            {
              "entity": "switch.rain_bird_sprinkler_3",
              "fill_container": true,
              "hold_action": {
                "action": "more-info"
              },
              "icon": "mdi:flower-pollen",
              "icon_color": "{% if is_state(entity, 'on') %}amber{% else %}grey{% endif %}",
              "layout": "vertical",
              "primary": "Bee Area",
              "secondary": "{% if is_state(entity, 'on') %}Watering{% else %}Idle{% endif %}",
              "tap_action": {
                "action": "toggle"
              },
              "type": "custom:mushroom-template-card"
            }
          ],
          "layout": {
            "grid-gap": "12px",
            "grid-template-columns": "repeat(4, minmax(0, 1fr))",
            "margin": 0,
            "mediaquery": {
              "(max-width: 600px)": {
                "grid-template-columns": "minmax(0, 1fr)"
              }
            },
            "padding": 0
          },
          "layout_type": "custom:grid-layout",
          "type": "custom:layout-card",
          "view_layout": {
            "grid-column": "span 12"
          }
        },
        {
          "cards": [
            {
              "heading": "Growing Conditions",
              "heading_style": "title",
              "icon": "mdi:chart-areaspline",
              "type": "heading"
            },
            {
              "apex_config": {
                "chart": {
                  "height": 330
                },
                "grid": {
                  "borderColor": "rgba(127,127,127,0.18)"
                },
                "stroke": {
                  "curve": "smooth"
                }
              },
              "card_mod": {
                "style": "ha-card {\n  overflow: hidden; border-radius: 26px; border: 1px solid rgba(255,255,255,0.10); background: linear-gradient(145deg, rgba(20,25,34,0.98), rgba(8,12,18,0.98)); box-shadow: 0 12px 34px rgba(0,0,0,0.28); }\n"
              },
              "graph_span": "24h",
              "header": {
                "colorize_states": true,
                "show": true,
                "show_states": true,
                "title": "Temperature and Humidity"
              },
              "series": [
                {
                  "color": "#ff9800",
                  "entity": "sensor.farmbot_pioneer_dr_weather_station_outdoor_temperature",
                  "group_by": {
                    "duration": "10min",
                    "func": "avg"
                  },
                  "name": "Temperature",
                  "opacity": 0.24,
                  "stroke_width": 3,
                  "type": "area",
                  "yaxis_id": "temp"
                },
                {
                  "color": "#42a5f5",
                  "entity": "sensor.farmbot_pioneer_dr_weather_station_humidity",
                  "group_by": {
                    "duration": "10min",
                    "func": "avg"
                  },
                  "name": "Humidity",
                  "stroke_width": 3,
                  "type": "line",
                  "yaxis_id": "humidity"
                }
              ],
              "type": "custom:apexcharts-card",
              "yaxis": [
                {
                  "decimals": 1,
                  "id": "temp"
                },
                {
                  "id": "humidity",
                  "max": 100,
                  "min": 0,
                  "opposite": true
                }
              ]
            }
          ],
          "layout": {
            "grid-gap": "12px",
            "grid-template-columns": "minmax(0, 1fr)",
            "margin": 0,
            "padding": 0
          },
          "layout_type": "custom:grid-layout",
          "type": "custom:layout-card",
          "view_layout": {
            "grid-column": "span 6"
          }
        },
        {
          "cards": [
            {
              "heading": "Watering Conditions",
              "heading_style": "title",
              "icon": "mdi:water-sync",
              "type": "heading"
            },
            {
              "apex_config": {
                "chart": {
                  "height": 330
                },
                "grid": {
                  "borderColor": "rgba(127,127,127,0.18)"
                },
                "stroke": {
                  "curve": "smooth"
                }
              },
              "card_mod": {
                "style": "ha-card {\n  overflow: hidden; border-radius: 26px; border: 1px solid rgba(255,255,255,0.10); background: linear-gradient(145deg, rgba(20,25,34,0.98), rgba(8,12,18,0.98)); box-shadow: 0 12px 34px rgba(0,0,0,0.28); }\n"
              },
              "graph_span": "24h",
              "header": {
                "colorize_states": true,
                "show": true,
                "show_states": true,
                "title": "Rain and Wind"
              },
              "series": [
                {
                  "color": "#1976d2",
                  "entity": "sensor.farmbot_pioneer_dr_weather_station_rain_rate_piezo",
                  "group_by": {
                    "duration": "5min",
                    "func": "max"
                  },
                  "name": "Rain Rate",
                  "opacity": 0.28,
                  "stroke_width": 3,
                  "type": "area",
                  "yaxis_id": "rain"
                },
                {
                  "color": "#26a69a",
                  "entity": "sensor.farmbot_pioneer_dr_weather_station_wind_speed",
                  "group_by": {
                    "duration": "5min",
                    "func": "avg"
                  },
                  "name": "Wind",
                  "stroke_width": 3,
                  "type": "line",
                  "yaxis_id": "wind"
                }
              ],
              "type": "custom:apexcharts-card",
              "yaxis": [
                {
                  "id": "rain",
                  "min": 0
                },
                {
                  "id": "wind",
                  "min": 0,
                  "opposite": true
                }
              ]
            }
          ],
          "layout": {
            "grid-gap": "12px",
            "grid-template-columns": "minmax(0, 1fr)",
            "margin": 0,
            "padding": 0
          },
          "layout_type": "custom:grid-layout",
          "type": "custom:layout-card",
          "view_layout": {
            "grid-column": "span 6"
          }
        },
        {
          "cards": [
            {
              "heading": "FarmBot Operations",
              "heading_style": "title",
              "icon": "mdi:robot-industrial",
              "type": "heading",
              "view_layout": {
                "grid-column": "1 / -1"
              }
            },
            {
              "entity": "switch.smart_switch_deviceid_001_outlet_2",
              "fill_container": true,
              "hold_action": {
                "action": "more-info"
              },
              "icon": "mdi:robot-industrial",
              "icon_color": "{% if is_state(entity, 'on') %}green{% else %}grey{% endif %}",
              "layout": "vertical",
              "primary": "FarmBot Power",
              "secondary": "{% if is_state(entity, 'on') %}Online{% else %}Offline{% endif %}",
              "tap_action": {
                "action": "toggle"
              },
              "type": "custom:mushroom-template-card"
            },
            {
              "fill_container": true,
              "icon": "mdi:calendar-clock",
              "icon_color": "purple",
              "layout": "vertical",
              "primary": "Daily Schedule",
              "secondary": "08:00 power on · 17:55 graceful shutdown",
              "tap_action": {
                "action": "none"
              },
              "type": "custom:mushroom-template-card"
            },
            {
              "card_mod": {
                "style": "ha-card {\n  overflow: hidden; border: 1px solid rgba(248,113,113,0.30); background: radial-gradient(circle at 10% 10%, rgba(239,68,68,0.18), transparent 48%), linear-gradient(135deg, rgba(55,18,22,0.97), rgba(14,20,27,0.97)); }\n"
              },
              "fill_container": true,
              "icon": "mdi:power-cycle",
              "icon_color": "red",
              "layout": "vertical",
              "primary": "Graceful Shutdown",
              "secondary": "Sequence identifiers still required",
              "tap_action": {
                "action": "none"
              },
              "type": "custom:mushroom-template-card"
            }
          ],
          "layout": {
            "grid-gap": "12px",
            "grid-template-columns": "repeat(3, minmax(0, 1fr))",
            "margin": 0,
            "mediaquery": {
              "(max-width: 600px)": {
                "grid-template-columns": "minmax(0, 1fr)"
              }
            },
            "padding": 0
          },
          "layout_type": "custom:grid-layout",
          "type": "custom:layout-card",
          "view_layout": {
            "grid-column": "span 12"
          }
        }
      ],
      "icon": "mdi:sprout",
      "layout": {
        "grid-auto-flow": "row dense",
        "grid-gap": "12px",
        "grid-template-columns": "repeat(12, minmax(0, 1fr))",
        "margin": 0,
        "mediaquery": {
          "(max-width: 1000px)": {
            "grid-template-columns": "minmax(0, 1fr)"
          },
          "(max-width: 1300px)": {
            "grid-template-columns": "repeat(6, minmax(0, 1fr))"
          }
        },
        "padding": 0
      },
      "path": "farm-max",
      "title": "Farm Max",
      "type": "custom:grid-layout"
    }
  ]
}
