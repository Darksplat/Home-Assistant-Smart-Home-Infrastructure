###############################################################################
# HOUSEHOLD CHORES
# Home Assistant Household Chore Tracking
#
# Household:
#   Jeremy
#   Leigh
#   Imogen
#   Dominic
#   Nate
#   Aeryn
#
# Dogs:
#   Walter & Astra
###############################################################################

###############################################################################
# DOG CHORE - LAST COMPLETED TIMES
###############################################################################

input_datetime:

  dog_breakfast_last_completed:
    name: Dog Breakfast - Last Completed
    has_date: true
    has_time: true

  dog_dinner_last_completed:
    name: Dog Dinner - Last Completed
    has_date: true
    has_time: true

  dog_walk_last_completed:
    name: Dog Walk - Last Completed
    has_date: true
    has_time: true

  dog_indoor_water_last_cleaned:
    name: Indoor Dog Water - Last Cleaned
    has_date: true
    has_time: true

  dog_outdoor_water_last_cleaned:
    name: Outdoor Dog Water - Last Cleaned
    has_date: true
    has_time: true

  walter_bath_last_completed:
    name: Walter Bath - Last Completed
    has_date: true
    has_time: true

  astra_bath_last_completed:
    name: Astra Bath - Last Completed
    has_date: true
    has_time: true

  walter_flea_last_completed:
    name: Walter Flea Tablet - Last Completed
    has_date: true
    has_time: true

  astra_flea_last_completed:
    name: Astra Flea Tablet - Last Completed
    has_date: true
    has_time: true

###############################################################################
# WHO COMPLETED EACH DOG CHORE
###############################################################################

input_text:

  dog_breakfast_completed_by:
    name: Dog Breakfast - Completed By
    max: 40

  dog_dinner_completed_by:
    name: Dog Dinner - Completed By
    max: 40

  dog_walk_completed_by:
    name: Dog Walk - Completed By
    max: 40

  dog_indoor_water_cleaned_by:
    name: Indoor Dog Water - Cleaned By
    max: 40

  dog_outdoor_water_cleaned_by:
    name: Outdoor Dog Water - Cleaned By
    max: 40

  walter_bath_completed_by:
    name: Walter Bath - Completed By
    max: 40

  astra_bath_completed_by:
    name: Astra Bath - Completed By
    max: 40

  walter_flea_completed_by:
    name: Walter Flea Tablet - Completed By
    max: 40

  astra_flea_completed_by:
    name: Astra Flea Tablet - Completed By
    max: 40

  dog_care_active_dog:
    name: Dog Care - Active Dog
    max: 20

  dog_care_active_person:
    name: Dog Care - Active Person
    max: 40

###############################################################################
# DOG CHORE STATUS
#
# ON  = RED   = Needs attention
# OFF = GREEN = Completed/current
###############################################################################

template:

  - binary_sensor:

      - name: Dog Breakfast Needs Attention
        unique_id: household_dog_breakfast_needs_attention
        icon: mdi:food-drumstick
        state: >
          {% if now().hour < 7 %}
            false
          {% else %}
            {% set last = states('input_datetime.dog_breakfast_last_completed') %}
            {% set who = states('input_text.dog_breakfast_completed_by') %}
            {% if who in ['unknown', 'unavailable', 'none', ''] %}
              true
            {% elif last in ['unknown', 'unavailable', 'none', ''] %}
              true
            {% else %}
              {{ as_datetime(last).date() != now().date() }}
            {% endif %}
          {% endif %}
        attributes:
          chore: "Feed Walter & Astra - Breakfast"
          schedule: "Daily 07:00-08:00"
          completed_by: >
            {{ states('input_text.dog_breakfast_completed_by') }}
          last_completed: >
            {{ states('input_datetime.dog_breakfast_last_completed') }}

      - name: Dog Dinner Needs Attention
        unique_id: household_dog_dinner_needs_attention
        icon: mdi:food-drumstick
        state: >
          {% if now().hour < 18 %}
            false
          {% else %}
            {% set last = states('input_datetime.dog_dinner_last_completed') %}
            {% set who = states('input_text.dog_dinner_completed_by') %}
            {% if who in ['unknown', 'unavailable', 'none', ''] %}
              true
            {% elif last in ['unknown', 'unavailable', 'none', ''] %}
              true
            {% else %}
              {{ as_datetime(last).date() != now().date() }}
            {% endif %}
          {% endif %}
        attributes:
          chore: "Feed Walter & Astra - Dinner"
          schedule: "Daily 18:00"
          completed_by: >
            {{ states('input_text.dog_dinner_completed_by') }}
          last_completed: >
            {{ states('input_datetime.dog_dinner_last_completed') }}

      - name: Dog Walk Needs Attention
        unique_id: household_dog_walk_needs_attention
        icon: mdi:dog-side
        state: >
          {% if now().weekday() >= 5 %}
            false
          {% else %}
            {% set last = states('input_datetime.dog_walk_last_completed') %}
            {% set who = states('input_text.dog_walk_completed_by') %}
            {% if who in ['unknown', 'unavailable', 'none', ''] %}
              true
            {% elif last in ['unknown', 'unavailable', 'none', ''] %}
              true
            {% else %}
              {{ as_datetime(last).date() != now().date() }}
            {% endif %}
          {% endif %}
        attributes:
          chore: "Walk Walter & Astra"
          schedule: "Weekdays"
          completed_by: >
            {{ states('input_text.dog_walk_completed_by') }}
          last_completed: >
            {{ states('input_datetime.dog_walk_last_completed') }}

      - name: Indoor Dog Water Needs Cleaning
        unique_id: household_indoor_dog_water_needs_cleaning
        icon: mdi:bowl
        state: >
          {% set last = states('input_datetime.dog_indoor_water_last_cleaned') %}
          {% set who = states('input_text.dog_indoor_water_cleaned_by') %}
          {% if who in ['unknown', 'unavailable', 'none', ''] %}
            true
          {% elif last in ['unknown', 'unavailable', 'none', ''] %}
            true
          {% else %}
            {{ (now().date() - as_datetime(last).date()).days >= 7 }}
          {% endif %}
        attributes:
          chore: "Clean Indoor Dog Water"
          schedule: "Weekly"
          completed_by: >
            {{ states('input_text.dog_indoor_water_cleaned_by') }}
          last_completed: >
            {{ states('input_datetime.dog_indoor_water_last_cleaned') }}

      - name: Outdoor Dog Water Needs Cleaning
        unique_id: household_outdoor_dog_water_needs_cleaning
        icon: mdi:bowl
        state: >
          {% set last = states('input_datetime.dog_outdoor_water_last_cleaned') %}
          {% set who = states('input_text.dog_outdoor_water_cleaned_by') %}
          {% if who in ['unknown', 'unavailable', 'none', ''] %}
            true
          {% elif last in ['unknown', 'unavailable', 'none', ''] %}
            true
          {% else %}
            {{ (now().date() - as_datetime(last).date()).days >= 7 }}
          {% endif %}
        attributes:
          chore: "Clean Outdoor Dog Water"
          schedule: "Weekly"
          completed_by: >
            {{ states('input_text.dog_outdoor_water_cleaned_by') }}
          last_completed: >
            {{ states('input_datetime.dog_outdoor_water_last_cleaned') }}

  - sensor:

      - name: "Primary Bedroom Blind Voltage"
        unique_id: primary_bedroom_blind_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: >
          {{ state_attr('sensor.automate_shade_7ih_pulse_blind_7ih_battery', 'battery_voltage') is not none }}
        state: >
          {{ state_attr('sensor.automate_shade_7ih_pulse_blind_7ih_battery', 'battery_voltage') | float }}

      - name: "TV Room Blind Voltage"
        unique_id: tv_room_blind_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: >
          {{ state_attr('sensor.automate_shade_269_pulse_blind_269_battery', 'battery_voltage') is not none }}
        state: >
          {{ state_attr('sensor.automate_shade_269_pulse_blind_269_battery', 'battery_voltage') | float }}

      - name: "Living Room Blind Voltage"
        unique_id: living_room_blind_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: >
          {{ state_attr('sensor.automate_shade_743_pulse_blind_743_battery', 'battery_voltage') is not none }}
        state: >
          {{ state_attr('sensor.automate_shade_743_pulse_blind_743_battery', 'battery_voltage') | float }}

      - name: "Kitchen Blind Voltage"
        unique_id: kitchen_blind_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: >
          {{ state_attr('sensor.automate_shade_9ok_pulse_blind_9ok_battery', 'battery_voltage') is not none }}
        state: >
          {{ state_attr('sensor.automate_shade_9ok_pulse_blind_9ok_battery', 'battery_voltage') | float }}

      - name: "Dog Door Blind Voltage"
        unique_id: dog_door_blind_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: >
          {{ state_attr('sensor.automate_shade_kcn_pulse_blind_kcn_battery', 'battery_voltage') is not none }}
        state: >
          {{ state_attr('sensor.automate_shade_kcn_pulse_blind_kcn_battery', 'battery_voltage') | float }}

      - name: "Dining Room Back Blind Voltage"
        unique_id: dining_room_back_blind_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: >
          {{ state_attr('sensor.automate_shade_buu_pulse_blind_buu_battery', 'battery_voltage') is not none }}
        state: >
          {{ state_attr('sensor.automate_shade_buu_pulse_blind_buu_battery', 'battery_voltage') | float }}

      - name: "Dining Room Side Blind Voltage"
        unique_id: dining_room_side_blind_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: >
          {{ state_attr('sensor.automate_shade_ydk_pulse_blind_ydk_battery', 'battery_voltage') is not none }}
        state: >
          {{ state_attr('sensor.automate_shade_ydk_pulse_blind_ydk_battery', 'battery_voltage') | float }}

###############################################################################
# REUSABLE CHORE COMPLETION SCRIPTS
###############################################################################

script:

  household_complete_chore:
    alias: Household - Complete Chore
    description: >
      Records when a household chore was completed and who completed it.
    mode: queued
    max: 20
    fields:
      datetime_entity:
        name: Last Completed Entity
        required: true
      person_entity:
        name: Completed By Entity
        required: true
      completed_by:
        name: Completed By
        required: true
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ datetime_entity }}"
        data:
          datetime: >
            {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
      - action: input_text.set_value
        target:
          entity_id: "{{ person_entity }}"
        data:
          value: "{{ completed_by }}"

  household_dog_care_walk:
    alias: Household - Dog Care - Walk Dogs
    mode: single
    sequence:
      - action: script.household_complete_chore
        data:
          datetime_entity: input_datetime.dog_walk_last_completed
          person_entity: input_text.dog_walk_completed_by
          completed_by: "{{ states('input_text.dog_care_active_person') }}"

  household_dog_care_water_indoor:
    alias: Household - Dog Care - Indoor Water
    mode: single
    sequence:
      - action: script.household_complete_chore
        data:
          datetime_entity: input_datetime.dog_indoor_water_last_cleaned
          person_entity: input_text.dog_indoor_water_cleaned_by
          completed_by: "{{ states('input_text.dog_care_active_person') }}"

  household_dog_care_water_outdoor:
    alias: Household - Dog Care - Outdoor Water
    mode: single
    sequence:
      - action: script.household_complete_chore
        data:
          datetime_entity: input_datetime.dog_outdoor_water_last_cleaned
          person_entity: input_text.dog_outdoor_water_cleaned_by
          completed_by: "{{ states('input_text.dog_care_active_person') }}"

  household_dog_care_water_both:
    alias: Household - Dog Care - Both Waters
    mode: single
    sequence:
      - action: script.household_complete_chore
        data:
          datetime_entity: input_datetime.dog_indoor_water_last_cleaned
          person_entity: input_text.dog_indoor_water_cleaned_by
          completed_by: "{{ states('input_text.dog_care_active_person') }}"
      - action: script.household_complete_chore
        data:
          datetime_entity: input_datetime.dog_outdoor_water_last_cleaned
          person_entity: input_text.dog_outdoor_water_cleaned_by
          completed_by: "{{ states('input_text.dog_care_active_person') }}"

  household_dog_care_bath:
    alias: Household - Dog Care - Bath Selected Dog
    mode: single
    sequence:
      - choose:
          - conditions: "{{ states('input_text.dog_care_active_dog') == 'Walter' }}"
            sequence:
              - action: script.household_complete_chore
                data:
                  datetime_entity: input_datetime.walter_bath_last_completed
                  person_entity: input_text.walter_bath_completed_by
                  completed_by: "{{ states('input_text.dog_care_active_person') }}"
          - conditions: "{{ states('input_text.dog_care_active_dog') == 'Astra' }}"
            sequence:
              - action: script.household_complete_chore
                data:
                  datetime_entity: input_datetime.astra_bath_last_completed
                  person_entity: input_text.astra_bath_completed_by
                  completed_by: "{{ states('input_text.dog_care_active_person') }}"

  household_dog_care_flea:
    alias: Household - Dog Care - Flea Tablet Selected Dog
    mode: single
    sequence:
      - choose:
          - conditions: "{{ states('input_text.dog_care_active_dog') == 'Walter' }}"
            sequence:
              - action: script.household_complete_chore
                data:
                  datetime_entity: input_datetime.walter_flea_last_completed
                  person_entity: input_text.walter_flea_completed_by
                  completed_by: "{{ states('input_text.dog_care_active_person') }}"
          - conditions: "{{ states('input_text.dog_care_active_dog') == 'Astra' }}"
            sequence:
              - action: script.household_complete_chore
                data:
                  datetime_entity: input_datetime.astra_flea_last_completed
                  person_entity: input_text.astra_flea_completed_by
                  completed_by: "{{ states('input_text.dog_care_active_person') }}"

  ###########################################################################
  # AERYN DIRECT BUTTON SCRIPTS
  #
  # These do not depend on NFC or the active dog/person selectors.
  ###########################################################################

  household_feed_dogs_aeryn:
    alias: Household - Feed Walter & Astra - Aeryn
    description: >
      Records Walter and Astra's breakfast or dinner as completed by Aeryn.
      Intended for Aeryn's Assistive Access dashboard.
    icon: mdi:food-drumstick
    mode: single
    sequence:
      - choose:
          - conditions:
              - condition: time
                after: "06:29:59"
                before: "10:00:00"
            sequence:
              - action: script.household_complete_chore
                data:
                  datetime_entity: input_datetime.dog_breakfast_last_completed
                  person_entity: input_text.dog_breakfast_completed_by
                  completed_by: "Aeryn"
          - conditions:
              - condition: time
                after: "16:29:59"
                before: "21:00:00"
            sequence:
              - action: script.household_complete_chore
                data:
                  datetime_entity: input_datetime.dog_dinner_last_completed
                  person_entity: input_text.dog_dinner_completed_by
                  completed_by: "Aeryn"

  household_walter_flea_aeryn:
    alias: Household - Walter Flea Tablet - Aeryn
    description: >
      Records Walter's flea tablet as given by Aeryn.
    icon: mdi:pill
    mode: single
    sequence:
      - action: script.household_complete_chore
        data:
          datetime_entity: input_datetime.walter_flea_last_completed
          person_entity: input_text.walter_flea_completed_by
          completed_by: "Aeryn"

  household_walter_bath_aeryn:
    alias: Household - Walter Bath - Aeryn
    description: >
      Records Walter's bath as completed by Aeryn.
    icon: mdi:shower-head
    mode: single
    sequence:
      - action: script.household_complete_chore
        data:
          datetime_entity: input_datetime.walter_bath_last_completed
          person_entity: input_text.walter_bath_completed_by
          completed_by: "Aeryn"

###############################################################################
# NFC CHORE AUTOMATIONS
###############################################################################

automation:

  - id: household_feed_dogs_nfc
    alias: Household - Feed Walter & Astra NFC
    description: >
      Records Walter and Astra's breakfast or dinner when the dog food
      NFC tag is scanned.
    mode: single
    triggers:
      - trigger: event
        event_type: tag_scanned
        event_data:
          tag_id: "423c34ad-66fa-4b38-a0de-d6a8f86decd7"
    variables:
      completed_by: >
        {% set users = {
          '5b7d6383d83843ccb66d0297edce7156': 'Jeremy',
          '1786782787f249debd09908150054fc8': 'Dominic',
          'b763254f9d6d4cd0ba04f4427a4fab59': 'Leigh'
        } %}
        {% set devices = {
          '6bb9b81c92e353835b8b1e4588eda063': 'Jeremy',
          '2defcc9e51b09b0fc44b1dd40c3b2892': 'Dominic',
          '99fd116e4a841fb54db279f6e9d214eb': 'Leigh',
          '58497de1912450f92987f80b3735c505': 'Nate'
        } %}
        {% set event_user_id = trigger.event.context.user_id | default('', true) %}
        {% set event_device_id = trigger.event.data.device_id | default('', true) %}
        {{ users.get(event_user_id, devices.get(event_device_id, 'Unknown')) }}
    actions:
      - choose:
          - conditions:
              - condition: time
                after: "06:29:59"
                before: "10:00:00"
            sequence:
              - action: script.household_complete_chore
                data:
                  datetime_entity: input_datetime.dog_breakfast_last_completed
                  person_entity: input_text.dog_breakfast_completed_by
                  completed_by: "{{ completed_by }}"
          - conditions:
              - condition: time
                after: "16:29:59"
                before: "21:00:00"
            sequence:
              - action: script.household_complete_chore
                data:
                  datetime_entity: input_datetime.dog_dinner_last_completed
                  person_entity: input_text.dog_dinner_completed_by
                  completed_by: "{{ completed_by }}"

  - id: household_dog_care_nfc_open_dashboard
    alias: Household - Dog Care NFC - Open Dashboard
    description: >
      Stores which dog was scanned and who scanned it, then sends the scanning
      phone a link to the dedicated Dog Care dashboard view.
    mode: parallel
    max: 10
    triggers:
      - trigger: event
        event_type: tag_scanned
    conditions:
      - condition: template
        value_template: >
          {{ trigger.event.data.tag_id in [
            'a6dcdeda-2533-43e2-a08f-cf5eecf35d51',
            '9a3fe03d-cdc1-46b0-80cd-11c9c4dfdb3c'
          ] }}
    variables:
      dog_name: >
        {% if trigger.event.data.tag_id == 'a6dcdeda-2533-43e2-a08f-cf5eecf35d51' %}
          Walter
        {% else %}
          Astra
        {% endif %}
      completed_by: >
        {% set users = {
          '5b7d6383d83843ccb66d0297edce7156': 'Jeremy',
          '1786782787f249debd09908150054fc8': 'Dominic',
          'b763254f9d6d4cd0ba04f4427a4fab59': 'Leigh'
        } %}
        {% set devices = {
          '6bb9b81c92e353835b8b1e4588eda063': 'Jeremy',
          '2defcc9e51b09b0fc44b1dd40c3b2892': 'Dominic',
          '99fd116e4a841fb54db279f6e9d214eb': 'Leigh',
          '58497de1912450f92987f80b3735c505': 'Nate'
        } %}
        {% set event_user_id = trigger.event.context.user_id | default('', true) %}
        {% set event_device_id = trigger.event.data.device_id | default('', true) %}
        {{ users.get(event_user_id, devices.get(event_device_id, 'Unknown')) }}
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.dog_care_active_dog
        data:
          value: "{{ dog_name }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.dog_care_active_person
        data:
          value: "{{ completed_by }}"
      - choose:
          - conditions: "{{ completed_by == 'Jeremy' }}"
            sequence:
              - action: notify.mobile_app_jem_iphone
                data:
                  title: "🐕 {{ dog_name }} - Dog Care"
                  message: "Tap to choose what you did."
                  data:
                    tag: dog_care_menu
                    url: "/dashboard-household/dog-care"
          - conditions: "{{ completed_by == 'Leigh' }}"
            sequence:
              - action: notify.mobile_app_ninja_guide_mum
                data:
                  title: "🐕 {{ dog_name }} - Dog Care"
                  message: "Tap to choose what you did."
                  data:
                    tag: dog_care_menu
                    url: "/dashboard-household/dog-care"
          - conditions: "{{ completed_by == 'Dominic' }}"
            sequence:
              - action: notify.mobile_app_the_green_ninja
                data:
                  title: "🐕 {{ dog_name }} - Dog Care"
                  message: "Tap to choose what you did."
                  data:
                    tag: dog_care_menu
                    url: "/dashboard-household/dog-care"
          - conditions: "{{ completed_by == 'Nate' }}"
            sequence:
              - action: notify.mobile_app_nathaniels_iphone
                data:
                  title: "🐕 {{ dog_name }} - Dog Care"
                  message: "Tap to choose what you did."
                  data:
                    tag: dog_care_menu
                    url: "/dashboard-household/dog-care"
        default:
          - action: persistent_notification.create
            data:
              title: Dog Care NFC
              message: >
                {{ dog_name }} was scanned by an unmapped phone.
                Device ID: {{ trigger.event.data.device_id }}
