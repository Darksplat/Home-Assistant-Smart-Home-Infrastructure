              | first
              | default(0)) | float(0) }}
        unit_of_measurement: "H/s"


    #########################################################################
    # MINER CONNECTIVITY
    #########################################################################

    binary_sensor:

      - name: "Duino Coin UNO1 Mining"
        unique_id: duino_coin_uno1_mining
        value_template: >
          {{ value_json.result.miners
             | selectattr('identifier', 'eq', 'UNO1')
