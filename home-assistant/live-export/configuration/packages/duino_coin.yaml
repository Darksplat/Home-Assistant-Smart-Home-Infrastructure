  ###########################################################################
  # DUINO-COIN FOUND BLOCK API
  ###########################################################################

  - resource: "https://server.duinocoin.com/foundBlocks.json"
    scan_interval: 60
    timeout: 15

    sensor:

      #######################################################################
      # LAST BLOCK HASH
      #######################################################################

      - name: "Duino Coin Last Block Hash"
        unique_id: duino_coin_last_block_hash
        icon: mdi:link-variant
        value_template: >
          {% set ns = namespace(
            latest_hash='none',
            latest_ts=0
          ) %}

          {% for hash, block in value_json.items() %}
            {% if 'darksplat' in (block['Finder'] | lower) %}

              {% set block_ts = as_timestamp(
                strptime(
                  block['Date'] ~ ' ' ~ block['Time'],
                  '%d/%m/%Y %H:%M:%S'
                )
              ) %}

              {% if block_ts > ns.latest_ts %}
                {% set ns.latest_ts = block_ts %}
                {% set ns.latest_hash = block['Hash'] %}
              {% endif %}

            {% endif %}
          {% endfor %}

          {{ ns.latest_hash }}


      #######################################################################
      # LAST BLOCK DATE / TIME
      #######################################################################

      - name: "Duino Coin Last Block Found"
        unique_id: duino_coin_last_block_found
        icon: mdi:clock-check-outline
        value_template: >
          {% set ns = namespace(
            latest='Never',
            latest_ts=0
          ) %}

          {% for hash, block in value_json.items() %}
            {% if 'darksplat' in (block['Finder'] | lower) %}

              {% set block_ts = as_timestamp(
                strptime(
                  block['Date'] ~ ' ' ~ block['Time'],
                  '%d/%m/%Y %H:%M:%S'
                )
              ) %}

              {% if block_ts > ns.latest_ts %}
                {% set ns.latest_ts = block_ts %}
                {% set ns.latest =
                  block['Date'] ~ ' ' ~ block['Time']
                %}
              {% endif %}

            {% endif %}
          {% endfor %}

          {{ ns.latest }}


      #######################################################################
      # LAST BLOCK REWARD
      #######################################################################

      - name: "Duino Coin Last Block Reward"
        unique_id: duino_coin_last_block_reward
        icon: mdi:cash
        unit_of_measurement: "DUCO"
        value_template: >
          {% set ns = namespace(
            reward=0,
            latest_ts=0
          ) %}

          {% for hash, block in value_json.items() %}
            {% if 'darksplat' in (block['Finder'] | lower) %}

              {% set block_ts = as_timestamp(
                strptime(
                  block['Date'] ~ ' ' ~ block['Time'],
                  '%d/%m/%Y %H:%M:%S'
                )
              ) %}

              {% if block_ts > ns.latest_ts %}
                {% set ns.latest_ts = block_ts %}
                {% set ns.reward =
                  block['Amount generated']
                %}
              {% endif %}

            {% endif %}
          {% endfor %}

          {{ ns.reward }}

###############################################################################
# DUINO-COIN FOUND BLOCK - PERSISTENT STORAGE
###############################################################################


  ###########################################################################
  # DUINO-COIN ESTIMATED USD PRICE
  ###########################################################################

  - resource: "https://server.duinocoin.com/v3/users/darksplat?limit=1"
    scan_interval: 300
    timeout: 15

    sensor:

      - name: "Duino Coin Price USD"
        unique_id: duino_coin_price_usd
        icon: mdi:currency-usd
        unit_of_measurement: "USD"
        value_template: >
          {{ value_json.result.exch_rates.max.price | float(0) }}


  ###########################################################################
  # USD TO AUD EXCHANGE RATE
  ###########################################################################

  - resource: "https://api.frankfurter.dev/v2/rate/USD/AUD?providers=RBA"
    scan_interval: 3600
    timeout: 15

    sensor:

      - name: "USD to AUD"
        unique_id: duino_coin_usd_to_aud
        icon: mdi:cash-sync
        value_template: >
          {{ value_json.rate | float(0) }}

input_text:

  duino_coin_saved_block_hash:
    name: "Duino Coin Saved Block Hash"
    icon: mdi:link-variant
    max: 100


input_number:

  duino_coin_saved_block_reward:
    name: "Duino Coin Saved Block Reward"
    icon: mdi:cash
    min: 0
    max: 1000
    step: 0.01
    mode: box
    unit_of_measurement: "DUCO"


input_datetime:

  duino_coin_saved_block_found:
    name: "Duino Coin Saved Block Found"
    icon: mdi:clock-check-outline
    has_date: true
    has_time: true


###############################################################################
# BLOCK FOUND CELEBRATION TIMER
###############################################################################

timer:

  duino_coin_block_celebration:
    name: "Duino Coin Block Celebration"
    icon: mdi:party-popper
    duration: "00:00:30"
    restore: true


###############################################################################
# DERIVED BLOCK INFORMATION
###############################################################################

template:

  - sensor:

      #########################################################################
      # HUMAN READABLE TIME SINCE LAST BLOCK
      #########################################################################

      - name: "Duino Coin Last Block Age"
        unique_id: duino_coin_last_block_age
        icon: mdi:timer-sand
        state: >
          {% set saved = states('input_datetime.duino_coin_saved_block_found') %}

          {% if saved in ['unknown', 'unavailable', 'none', ''] %}
            Never
          {% else %}

            {% set found = as_timestamp(saved, default=none) %}

            {% if found is none %}
              Never
            {% else %}

              {% set seconds = (as_timestamp(now()) - found) | int(0) %}
              {% set days = (seconds // 86400) %}
              {% set hours = ((seconds % 86400) // 3600) %}
              {% set minutes = ((seconds % 3600) // 60) %}

              {% if days > 0 %}
                {{ days }}d {{ hours }}h ago
              {% elif hours > 0 %}
                {{ hours }}h {{ minutes }}m ago
              {% elif minutes > 0 %}
                {{ minutes }}m ago
              {% else %}
                Just now
              {% endif %}

            {% endif %}
          {% endif %}



      #########################################################################
      # MINER CONTINUOUS CONNECTION DURATION
      #
      # These sensors show how long Home Assistant has continuously seen each
      # miner as online. "Offline" is shown whenever the corresponding mining
      # binary sensor is off.
      #########################################################################


      - name: "Duino Coin UNO1 Connected For"
        unique_id: duino_coin_uno1_connected_for
        icon: mdi:timer-outline
        state: >
          {% set e = 'binary_sensor.duino_coin_uno1_mining' %}
          {% if is_state(e, 'on') %}
            {% set s = (as_timestamp(now()) - as_timestamp(states[e].last_changed)) | int(0) %}
            {% set d = s // 86400 %}
            {% set h = (s % 86400) // 3600 %}
            {% set m = (s % 3600) // 60 %}
            {% if d > 0 %}
              {{ d }}d {{ h }}h
            {% elif h > 0 %}
              {{ h }}h {{ m }}m
            {% else %}
              {{ m }}m
            {% endif %}
          {% else %}
            Offline
          {% endif %}


