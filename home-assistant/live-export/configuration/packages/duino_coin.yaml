###############################################################################
# DUINO-COIN HOME ASSISTANT PACKAGE
#
# Account: darksplat
#
# Provides:
#   - Balance
#   - Active worker count
#   - Total hashrate
#   - Raspberry Pi monitoring
#   - ESP32 monitoring
#   - ESP8266 monitoring
#   - UNO1 - UNO8 monitoring
#   - Individual miner connectivity
#   - Duino-Coin found-block monitoring
#
###############################################################################


###############################################################################
# REST API
###############################################################################

rest:

  ###########################################################################
  # DUINO-COIN ACCOUNT / MINER API
  ###########################################################################

  - resource: "https://server.duinocoin.com/users/darksplat"
    scan_interval: 60
    timeout: 15

    sensor:

      #######################################################################
      # ACCOUNT
      #######################################################################

      - name: "Duino Coin Balance"
        unique_id: duino_coin_balance
        value_template: >
          {{ value_json.result.balance.balance | float(0) | round(4) }}
        unit_of_measurement: "DUCO"
        icon: mdi:currency-usd

      - name: "Duino Coin Active Workers"
        unique_id: duino_coin_active_workers
        value_template: >
          {{ value_json.result.miners | count }}
        unit_of_measurement: "workers"
        icon: mdi:pickaxe

      - name: "Duino Coin Total Hashrate"
        unique_id: duino_coin_total_hashrate
        value_template: >
          {{ value_json.result.miners
             | map(attribute='hashrate')
             | map('float')
             | sum
             | round(0) }}
        unit_of_measurement: "H/s"
        icon: mdi:speedometer


      #######################################################################
      # RASPBERRY PI
      #######################################################################

      - name: "Duino Coin RPI Hashrate"
        unique_id: duino_coin_rpi_hashrate
        value_template: >
          {% set ns = namespace(total=0) %}
          {% for miner in value_json.result.miners %}
            {% if miner.identifier == "RPI - RPi" %}
              {% set ns.total = ns.total + (miner.hashrate | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ ns.total | round(0) }}
        unit_of_measurement: "H/s"
        icon: mdi:raspberry-pi

      - name: "Duino Coin RPI Temperature"
        unique_id: duino_coin_rpi_temperature
        value_template: >
          {% for miner in value_json.result.miners %}
            {% if miner.identifier == "RPI - RPi" and miner.it %}
              {{ miner.it
                 | replace("CPU temperature:", "")
                 | replace("*C", "")
                 | replace("C", "")
                 | trim
                 | float(0)
                 | round(1) }}
              {% break %}
            {% endif %}
          {% endfor %}
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermometer

      #######################################################################
      # ESP32
      #######################################################################

      - name: "Duino Coin ESP32 Hashrate"
        unique_id: duino_coin_esp32_hashrate
        value_template: >
          {% set ns = namespace(total=0) %}
          {% for miner in value_json.result.miners %}
            {% if "ESP32 Miner" in miner.software %}
              {% set ns.total = ns.total + (miner.hashrate | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ ns.total | round(0) }}
        unit_of_measurement: "H/s"
        icon: mdi:chip


      #######################################################################
      # ESP8266
      #######################################################################

      - name: "Duino Coin 8266 No1 Hashrate"
        unique_id: duino_coin_8266_no1_hashrate
        value_template: >
          {{ (value_json.result.miners
              | selectattr('identifier', 'eq', '8266 No1')
              | map(attribute='hashrate')
              | first
              | default(0)) | float(0) | round(0) }}
        unit_of_measurement: "H/s"
        icon: mdi:chip

      - name: "Duino Coin 8266 No2 Hashrate"
        unique_id: duino_coin_8266_no2_hashrate
        value_template: >
          {{ (value_json.result.miners
              | selectattr('identifier', 'eq', '8266 No2')
              | map(attribute='hashrate')
              | first
              | default(0)) | float(0) | round(0) }}
        unit_of_measurement: "H/s"
        icon: mdi:chip


      #######################################################################
      # ARDUINO UNO MINERS
      #######################################################################

      - name: "Duino Coin UNO1 Hashrate"
        unique_id: duino_coin_uno1_hashrate
        value_template: >
          {{ (value_json.result.miners
              | selectattr('identifier', 'eq', 'UNO1')
              | map(attribute='hashrate')
              | first
              | default(0)) | float(0) }}
        unit_of_measurement: "H/s"

      - name: "Duino Coin UNO2 Hashrate"
        unique_id: duino_coin_uno2_hashrate
        value_template: >
          {{ (value_json.result.miners
              | selectattr('identifier', 'eq', 'UNO2')
              | map(attribute='hashrate')
              | first
              | default(0)) | float(0) }}
        unit_of_measurement: "H/s"

      - name: "Duino Coin UNO3 Hashrate"
        unique_id: duino_coin_uno3_hashrate
        value_template: >
          {{ (value_json.result.miners
              | selectattr('identifier', 'eq', 'UNO3')
              | map(attribute='hashrate')
              | first
              | default(0)) | float(0) }}
        unit_of_measurement: "H/s"

      - name: "Duino Coin UNO4 Hashrate"
        unique_id: duino_coin_uno4_hashrate
        value_template: >
          {{ (value_json.result.miners
              | selectattr('identifier', 'eq', 'UNO4')
              | map(attribute='hashrate')
              | first
              | default(0)) | float(0) }}
        unit_of_measurement: "H/s"

      - name: "Duino Coin UNO5 Hashrate"
        unique_id: duino_coin_uno5_hashrate
        value_template: >
          {{ (value_json.result.miners
              | selectattr('identifier', 'eq', 'UNO5')
