      - name: "Duino Coin 8266 No2 Connected For"
        unique_id: duino_coin_8266_no2_connected_for
        icon: mdi:timer-outline
        state: >
          {% set e = 'binary_sensor.duino_coin_8266_no2_mining' %}
          {% if is_state(e, 'on') %}
            {% set s = (as_timestamp(now()) - as_timestamp(states[e].last_changed)) | int(0) %}
            {% set d = s // 86400 %}
            {% set h = (s % 86400) // 3600 %}
            {% set m = (s % 3600) // 60 %}
            {% if d > 0 %}
              {{ d }}d {{ h }}h
            {% elif h > 0 %}
              {{ h }}h {{ m }}m
            {% else %}
              {{ m }}m
            {% endif %}
          {% else %}
            Offline
          {% endif %}



      #########################################################################
      # DUINO-COIN BALANCE VALUE IN AUD
      #########################################################################

      - name: "Duino Coin Balance AUD"
        unique_id: duino_coin_balance_aud
        icon: mdi:cash-multiple
        unit_of_measurement: "AUD"
        state_class: measurement
        state: >
          {% set balance = states('sensor.duino_coin_balance') | float(0) %}
          {% set duco_usd = states('sensor.duino_coin_price_usd') | float(0) %}
          {% set usd_aud = states('sensor.usd_to_aud') | float(0) %}

          {{ (balance * duco_usd * usd_aud) | round(2) }}


  - binary_sensor:

      #########################################################################
      # TRUE WHILE THE 30 SECOND CELEBRATION IS RUNNING
      #########################################################################

      - name: "Duino Coin Block Celebration"
        unique_id: duino_coin_block_celebration
        icon: mdi:party-popper
        state: >
          {{ is_state('timer.duino_coin_block_celebration', 'active') }}


###############################################################################
# BLOCK DETECTION AUTOMATION
###############################################################################

automation:

  - id: duino_coin_detect_new_block
    alias: "Duino Coin - Detect New Block"
    description: >
      Detects a new Duino-Coin block found by darksplat, permanently stores
      the block information and starts the dashboard celebration timer.

    trigger:

      - platform: state
        entity_id: sensor.duino_coin_last_block_hash

    condition:

      #########################################################################
      # IGNORE NONE / UNKNOWN / UNAVAILABLE
      #########################################################################

      - condition: template
        value_template: >
          {{
            trigger.to_state is not none
            and trigger.to_state.state not in
              ['none', 'unknown', 'unavailable', '']
          }}

      #########################################################################
      # ONLY PROCESS A HASH WE HAVE NOT ALREADY SAVED
      #########################################################################

      - condition: template
        value_template: >
          {{
            trigger.to_state.state
            != states('input_text.duino_coin_saved_block_hash')
          }}

    action:

      #########################################################################
      # SAVE BLOCK HASH
      #########################################################################

      - service: input_text.set_value
        target:
          entity_id: input_text.duino_coin_saved_block_hash
        data:
          value: >
            {{ trigger.to_state.state }}


      #########################################################################
      # SAVE BLOCK REWARD
      #########################################################################

      - service: input_number.set_value
        target:
          entity_id: input_number.duino_coin_saved_block_reward
        data:
          value: >
            {{ states('sensor.duino_coin_last_block_reward') | float(0) }}


      #########################################################################
      # SAVE DATE AND TIME
      #########################################################################

      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.duino_coin_saved_block_found
        data:
          datetime: >
            {% set raw = states('sensor.duino_coin_last_block_found') %}
            {% set parsed = strptime(
              raw,
              '%d/%m/%Y %H:%M:%S',
              none
            ) %}

            {% if parsed is not none %}
              {{ parsed.strftime('%Y-%m-%d %H:%M:%S') }}
            {% else %}
              {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
            {% endif %}


      #########################################################################
      # START 30 SECOND CELEBRATION
      #########################################################################

      - service: timer.start
        target:
          entity_id: timer.duino_coin_block_celebration
        data:
          duration: "00:00:30"

    mode: single


###############################################################################
# MANUAL TEST SCRIPT
#
# This DOES NOT alter the stored block information.
# It only starts the 30 second celebration timer so we can test the dashboard.
###############################################################################

script:

  duino_coin_test_block_celebration:
    alias: "Duino Coin - Test Block Celebration"
    icon: mdi:party-popper
    sequence:

      - service: timer.start
        target:
          entity_id: timer.duino_coin_block_celebration
        data:
          duration: "00:00:30"