- id: '1788345404906'
  alias: Bin Night - Household Reminder
  description: Notify the household at 7 PM when bins are due tomorrow
  triggers:
  - trigger: time
    at: '19:00:00'
  conditions:
  - condition: template
    value_template: "{{\n  states('sensor.waste_collection_schedule_general_waste')
      | int(99) == 1\n  or states('sensor.waste_collection_schedule_recycling') |
      int(99) == 1\n  or states('sensor.waste_collection_schedule_green_waste') |
      int(99) == 1\n}}\n"
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.household_notifications
    data:
      title: "\U0001F5D1️ Bin Night"
      message: "{% set ns = namespace(bins=[]) %}\n{% if states('sensor.waste_collection_schedule_general_waste')
        | int(99) == 1 %}\n  {% set ns.bins = ns.bins + ['\U0001F534 General Waste']
        %}\n{% endif %}\n{% if states('sensor.waste_collection_schedule_recycling')
        | int(99) == 1 %}\n  {% set ns.bins = ns.bins + ['\U0001F7E1 Recycling'] %}\n{%
        endif %}\n{% if states('sensor.waste_collection_schedule_green_waste') | int(99)
        == 1 %}\n  {% set ns.bins = ns.bins + ['\U0001F7E2 Green Waste'] %}\n{% endif
        %}\nBins need to go out tonight: {{ ns.bins | join(', ') }}. Collection is
        tomorrow morning."
  mode: single
- id: '1788419519086'
  alias: Fronius - Amber Negative FIT Load Following
  description: 'Locally curtails the Fronius GEN24 during negative Amber feed-in pricing
    when the Sigenergy battery is full. Uses whole-site grid import/export as feedback
    to load-follow the house and avoid paid export.

    '
  triggers:
  - seconds: /30
    trigger: time_pattern
  - entity_id:
    - sensor.amber_express_home_feed_in_price
    - sensor.sigen_plant_battery_state_of_charge
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  not (\n    fit_valid | bool\n    and soc_valid | bool\n
          \   and export_valid | bool\n    and import_valid | bool\n  )\n}}\n"
      sequence:
      - action: number.set_value
        target:
          entity_id: number.garage_pioneer_maidengully_pv_ac_power_limit
        data:
          value: 100
      - action: switch.turn_off
        target:
          entity_id: switch.garage_pioneer_maidengully_pv_ac_power_limiting
    - conditions:
      - condition: template
        value_template: '{{ fit >= 0 }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.garage_pioneer_maidengully_pv_ac_power_limit
        data:
          value: 100
      - delay: 00:00:02
      - action: switch.turn_off
        target:
          entity_id: switch.garage_pioneer_maidengully_pv_ac_power_limiting
    - conditions:
      - condition: template
        value_template: '{{ fit < 0 and soc < 99 }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.garage_pioneer_maidengully_pv_ac_power_limit
        data:
          value: 100
      - delay: 00:00:02
      - action: switch.turn_off
        target:
          entity_id: switch.garage_pioneer_maidengully_pv_ac_power_limiting
    - conditions:
      - condition: template
        value_template: '{{ fit < 0 and soc >= 99 }}'
      sequence:
      - if:
        - condition: state
          entity_id: switch.garage_pioneer_maidengully_pv_ac_power_limiting
          state: 'off'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.garage_pioneer_maidengully_pv_ac_power_limiting
        - delay: 00:00:03
      - if:
        - condition: template
          value_template: '{{ net_export_kw > 0.15 or net_export_kw < -0.30 }}

            '
        then:
        - action: number.set_value
          target:
            entity_id: number.garage_pioneer_maidengully_pv_ac_power_limit
          data:
            value: '{{ new_limit }}'
  mode: restart
  variables:
    fit_valid: '{{ has_value(''sensor.amber_express_home_feed_in_price'') }}

      '
    soc_valid: '{{ has_value(''sensor.sigen_plant_battery_state_of_charge'') }}

      '
    export_valid: '{{ has_value(''sensor.sigen_plant_grid_export_power'') }}

      '
    import_valid: '{{ has_value(''sensor.sigen_plant_grid_import_power'') }}

      '
    fit: '{{ states(''sensor.amber_express_home_feed_in_price'') | float(0) }}

      '
    soc: '{{ states(''sensor.sigen_plant_battery_state_of_charge'') | float(0) }}

      '
    export_kw: '{{ states(''sensor.sigen_plant_grid_export_power'') | float(0) }}

      '
    import_kw: '{{ states(''sensor.sigen_plant_grid_import_power'') | float(0) }}

      '
    net_export_kw: "{{\n  states('sensor.sigen_plant_grid_export_power') | float(0)\n
      \ -\n  states('sensor.sigen_plant_grid_import_power') | float(0)\n}}\n"
    current_limit: "{{\n  states('number.garage_pioneer_maidengully_pv_ac_power_limit')\n
      \ | float(100)\n}}\n"
    new_limit: "{% set current =\n   states('number.garage_pioneer_maidengully_pv_ac_power_limit')\n
      \  | float(100)\n%} {% set export =\n   states('sensor.sigen_plant_grid_export_power')\n
      \  | float(0)\n%} {% set import =\n   states('sensor.sigen_plant_grid_import_power')\n
      \  | float(0)\n%} {% set net = export - import %}\n{# GEN24 = 10 kW, therefore
      1 kW = 10 percentage points #} {% set raw = current - (net * 10) %}\n{# Clamp
      result between 0 and 100 percent #} {{ [[raw, 0] | max, 100] | min | round(1)
      }}\n"
