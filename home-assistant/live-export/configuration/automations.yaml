      minutes: 30
      seconds: 0
      milliseconds: 0
  - action: switch.turn_off
    target:
      entity_id: switch.rain_bird_sprinkler_1
  - delay: 00:00:10
  - action: switch.turn_on
    target:
      entity_id: switch.rain_bird_sprinkler_3
  - delay: 00:30:00
  - action: switch.turn_off
    target:
      entity_id: switch.rain_bird_sprinkler_3
  - delay: 00:00:10
  - action: switch.turn_on
    target:
      entity_id: switch.rain_bird_sprinkler_2
  - delay: 00:30:00
  - action: switch.turn_off
    target:
      entity_id: switch.rain_bird_sprinkler_2
  - delay: 00:00:10
  - action: switch.turn_off
    target:
      entity_id: switch.smart_switch_26030582330465570902c4e7ae28b8aa_outlet_1
  mode: single
- id: '1783560423508'
  alias: FarmBot Power Schedule
  description: Turn the FarmBot power on at 8:00 AM and off at 6:00 PM every day
  triggers:
  - trigger: time
    at: 08:00:00
    id: power_on
  - trigger: time
    at: '18:00:00'
    id: power_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: power_on
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.smart_switch_26030582330465570902c4e7ae28b8aa_outlet_2
    - conditions:
      - condition: trigger
        id: power_off
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.smart_switch_26030582330465570902c4e7ae28b8aa_outlet_2
  mode: single
- id: '1783842643540'
  alias: FarmBot – Graceful Shutdown at 17:55
  description: Runs the FarmBot graceful shutdown sequence each day at 17:55
  triggers:
  - trigger: time
    at: '17:55:00'
  conditions: []
  actions:
  - action: select.select_option
    target:
      entity_id: select.farmbot_sequence
    data:
      option: "{{ state_attr('select.farmbot_sequence', 'options')\n   | select('match',
        '^314129:')\n   | list\n   | first }}"
  mode: single
- id: '1785233513587'
  alias: Blinds - Sunset
  description: Close all blinds at sunset and leave Dog Door at 68%
  triggers:
  - trigger: sun
    event: sunset
  conditions: []
  actions:
  - action: cover.close_cover
    target:
      entity_id:
      - cover.dining_room_back
      - cover.dining_room_side
      - cover.kitchen
      - cover.living_room
      - cover.primary_bedroom
      - cover.tv_room
  - action: cover.set_cover_position
    target:
      entity_id: cover.dog_door
    data:
      position: 68
  mode: single
- id: '1785233531203'
  alias: Blinds - Morning Open
  description: 'Opens all blinds at 07:20 on weekdays during daylight saving, 07:30
    on weekdays during standard time, and 08:00 on weekends.

    '
  triggers:
  - trigger: time
    at: 07:20:00
    id: weekday_summer
  - trigger: time
    at: 07:30:00
    id: weekday_winter
  - trigger: time
    at: 08:00:00
    id: weekend
  conditions:
  - condition: template
    value_template: "{% set weekday = now().weekday() < 5 %} {% set daylight_saving
      = now().utcoffset().total_seconds() == 39600 %}\n{{\n  (trigger.id == 'weekday_summer'
      and weekday and daylight_saving)\n  or\n  (trigger.id == 'weekday_winter' and
      weekday and not daylight_saving)\n  or\n  (trigger.id == 'weekend' and not weekday)\n}}\n"
  actions:
  - action: cover.open_cover
    target:
      entity_id:
      - cover.dining_room_back
      - cover.dining_room_side
      - cover.dog_door
      - cover.kitchen
      - cover.living_room
      - cover.primary_bedroom
      - cover.tv_room
  mode: single
- id: '1785302227686'
  alias: Letterbox Sentinel - Parcel Detected
  description: Latches parcel waiting and notifies when the MYGGBETT parcel door is
    opened
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.myggbett_door_window_sensor_door
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.letterbox_parcel_waiting
  - action: notify.mobile_app_jem_iphone
    data:
      title: "\U0001F4E6 Parcel Delivered"
      message: A parcel has been delivered to the parcel door.
  - action: notify.mobile_app_alkira_pro_ipad
    data:
      title: "\U0001F4E6 Parcel Delivered"
      message: A parcel has been delivered to the parcel door.
  mode: single
- id: '1785303470675'
  alias: Letterbox Sentinel - Parcel Sensor Battery Alerts
  description: Two-stage battery warnings for the IKEA MYGGBETT parcel sensor.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.myggbett_door_window_sensor_battery
    below: 26
    id: battery_25
  - trigger: numeric_state
    entity_id: sensor.myggbett_door_window_sensor_battery
    below: 16
    id: battery_15
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: battery_25
      sequence:
      - action: notify.mobile_app_jem_iphone
        data:
          title: "\U0001F4E6 Letterbox Sentinel"
          message: Parcel sensor battery is {{ states('sensor.myggbett_door_window_sensor_battery')
            }}%. Change the AAA battery soon.
      - action: notify.mobile_app_alkira_pro_ipad
        data:
          title: "\U0001F4E6 Letterbox Sentinel"
          message: Parcel sensor battery is {{ states('sensor.myggbett_door_window_sensor_battery')
            }}%. Change the AAA battery soon.
    - conditions:
      - condition: trigger
        id: battery_15
      sequence:
      - action: notify.mobile_app_jem_iphone
        data:
          title: "\U0001FAAB LETTERBOX SENTINEL - BATTERY CRITICAL"
          message: Parcel sensor battery is {{ states('sensor.myggbett_door_window_sensor_battery')
            }}%. Change the AAA battery NOW.
          data:
            push:
              interruption-level: time-sensitive
      - action: notify.mobile_app_alkira_pro_ipad
        data:
          title: "\U0001FAAB LETTERBOX SENTINEL - BATTERY CRITICAL"
          message: Parcel sensor battery is {{ states('sensor.myggbett_door_window_sensor_battery')
            }}%. Change the AAA battery NOW.
          data:
            push:
              interruption-level: time-sensitive
  mode: single
