- id: '1783558011933'
  alias: Garden Pressure Pump Schedule
  triggers:
  - trigger: time
    at: '13:30:00'
    id: start
  - trigger: time
    at: '13:35:00'
    id: stop
  conditions:
  - condition: time
    weekday:
    - mon
    - thu
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.smart_switch_26030582330465570902c4e7ae28b8aa_outlet_1
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.smart_switch_26030582330465570902c4e7ae28b8aa_outlet_1
  mode: single
- id: '1783559291056'
