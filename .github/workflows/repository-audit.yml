name: Repository audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile repository Python tools
        run: |
          python3 -m py_compile tools/ha-export/*.py tools/repo-audit/*.py

      - name: Check relative Markdown links
        run: |
          python3 tools/repo-audit/check_markdown_links.py --repo .
